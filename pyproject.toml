[project]
name = "lumi-companion"
version = "0.1.0"
description = "Live Understanding & Multimodal Interactivity Companion"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper>=1.0.0",
    "httpx>=0.27.0",
    "onnxruntime>=1.17.0",
    "opencv-python>=4.9.0",
    "pillow>=10.0.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "srt>=3.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
