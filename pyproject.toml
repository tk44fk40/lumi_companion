[project]
name = "lumi-companion"
version = "0.1.0"
description = "Live Understanding & Multimodal Interactivity Companion"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper>=1.0.0",
    "google-genai>=2.17.0",
    "httpx>=0.27.0",
    "janome>=0.5.0",
    "jiwer>=3.0.0",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9.24.0.43",
    "onnxruntime>=1.17.0",
    "opencv-python>=4.9.0",
    "pillow>=10.0.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pyyaml>=6.0",
    "srt>=3.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lumi_companion"]

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [".agents"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "D",    # pydocstyle
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501",  # 行長オーバーは ruff format に任せる
    "D415",  # Docstring 末尾ピリオド無効化 (日本語対応)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# 全角文字対応 (日本語コメント・文字列・Docstring)
"src/*" = ["RUF001", "RUF002", "RUF003"]
"scripts/*" = ["RUF001", "RUF002", "RUF003"]
# テストコードは Docstring ルール全般および全角文字警告を免除
"tests/*" = ["D", "RUF001", "RUF002", "RUF003"]
"__init__.py" = ["D104"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.basedpyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "pre-commit>=4.6.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]
